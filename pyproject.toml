[project]
name = "incident-agent"
version = "0.1.0"
description = "AI Incident Resolution Agent for investigating production/service incidents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.120",
  "uvicorn[standard]>=0.29,<0.31",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "httpx>=0.27,<0.28",
]
dev = [
  "pytest>=8.0,<9",
  "httpx>=0.27,<0.28",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
